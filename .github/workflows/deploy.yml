name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar y prerenderizar
        run: bun run build

      - name: Comprobar archivos generados
        run: |
          echo "Contenido de .output/public:"
          find .output/public -maxdepth 3 -type f | sort

      - name: Crear index.html si es necesario
        run: |
          if [ ! -f ".output/public/index.html" ]; then
            echo "ERROR: No se encontró index.html"
            echo "El proyecto necesita prerenderizado estático."
            exit 1
          fi

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
